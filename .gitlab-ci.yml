# Pin the container image explicitly: this is a Docker-executor runner whose
# default image is ubuntu:20.04 (focal), which is too old on two counts --
# its gcc (10) predates C++20's finalized __cplusplus value (202002L, needed
# by parquet_wrapper.cpp; GCC reports it only from 11), and it has no pipx.
# ubuntu:22.04 (GCC/gfortran 11) clears both, but gfortran 11 miscompiles the
# optional-allocatable-character argument pass-through in schema%add_col_qc
# (returns a corrupted column name -> a spurious "column not found" abort).
# ubuntu:24.04 ships gfortran 13, where that is fixed, and still has pipx, the
# modern Arrow apt packages, and a C++20-capable g++ -- and its default gcov
# matches the default compiler, so no per-compiler overrides are needed below.
# See README.md's Prerequisites for the minimum-gfortran note.
image: ubuntu:24.04

variables:
  DEBIAN_FRONTEND: noninteractive

before_script:
  - apt-get update -y
  - apt-get upgrade -y
  - apt-get install -y --no-install-recommends ca-certificates lsb-release wget gnupg
        gfortran-14 gcc-14 g++-14 make git git-lfs gcovr

  # Installing FPM (Fortran Package Manager) via pipx
  - apt-get install -y python3-venv
  - apt-get install -y pipx
  - pipx ensurepath
  - pipx install fpm
  - export PATH=~/.local/bin:$PATH

  # test/fixtures/*.parquet are tracked via git-lfs (see .gitattributes) --
  # pull the real file contents before the test suite tries to read them.
  # --skip-repo: only sets up git-lfs's global filter config (needed for
  # `pull` to smudge the pointer files); it deliberately skips installing
  # repo-local hooks (pre-push etc.), which GitLab's own checkout may already
  # have created -- CI never pushes from this checkout, so those hooks would
  # be both unnecessary and (per the error above) a reason for this step to
  # fail outright if one already exists.
  - git lfs install --skip-repo
  - git lfs pull

  # Install the Arrow/Parquet C++ library from Arrow's own apt repository --
  # see README.md's Prerequisites section. libarrow-compute-dev provides
  # libarrow_compute (Arrow ships its compute kernels, used for
  # parquet_close_reader(..., print_stat=.true.)'s min/max calculation, in a
  # separate library from core libarrow), which fpm.toml's link list needs.
  - wget "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
  - apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
  - apt-get update -y
  - apt-get install -y -V libarrow-dev libarrow-compute-dev libparquet-dev

stages:
  - lint
  - test
  - docs

# Fast, isolated checks that need only python3 -- no Arrow/Parquet/fpm/gfortran/git-lfs setup,
# so this deliberately overrides the top-level before_script the same way the readthedocs job
# below does, for a job that runs in well under a second. tools/check_bindc_boundary.py verifies
# every Fortran bind(C) interface (src/parquet_bindings.f90, plus the debug-hook interfaces in
# test/error_scenarios.f90/test_temporal.f90) still matches its C++ extern "C" definition in
# src/parquet_wrapper.cpp -- a mismatch here compiles cleanly on both sides and corrupts memory
# silently at runtime, so this permanently retires that failure class instead of relying on a
# one-off manual review (see CLAUDE.md's "bind(C)" boundary notes). tools/check_doc_anchors.py
# validates every #anchor link in this repository's *.md files against the anchors GitHub would
# actually generate -- previously a manual-only step (see CONTRIBUTING.md), added here too since
# it is equally free to run on every push.
lint:
  stage: lint
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends python3
  script:
    - python3 tools/check_bindc_boundary.py
    - python3 tools/check_doc_anchors.py

test:
  # Selects the Docker-executor runner; the image: above overrides its default
  # ubuntu:20.04 container with ubuntu:24.04.
  tags:
    - focal
  stage: test
  variables:
    # See README.md's Environment variables section: `-std=c++20` is required
    # on every platform (Arrow/Parquet headers use std::span unconditionally).
    # FPM_LDFLAGS supplies the C++ runtime (-lstdc++ on Linux/GCC), since
    # parquet-fortran's own fpm.toml link list doesn't include it (consumers,
    # including this CI job, are expected to supply it via FPM_LDFLAGS). No
    # -I/-L path is needed for either: the apt packages above install Arrow
    # to the standard system prefix, already on gcc/ld's default search path.
    # --coverage on both instruments src/parquet_wrapper.cpp alongside the
    # Fortran sources below -- safe here specifically because this image's
    # gfortran/gcc/g++ all come from the same apt GCC install (one matched
    # GNU toolchain), so the .cpp's gcov data reads back with the same gcovr
    # invocation below with no format mismatch. This does NOT generalize to
    # every dev machine -- e.g. a Mac with gfortran from one toolchain (say
    # MacPorts GCC) and a default `clang++` FPM_CXX would produce gcov data
    # in Clang's format, which plain GNU `gcov`/`gcovr` cannot reliably read
    # -- see CONTRIBUTING.md's coverage section.
    FPM_CXXFLAGS: "-std=c++20 --coverage"
    FPM_LDFLAGS: "-lstdc++ --coverage"
  coverage: /^TOTAL.*\s+(\d+\%)$/
  script:
    # Source is kept within the standard 132-column free-form limit, so no
    # -ffree-line-length-none override is needed; FPM_FFLAGS only adds the
    # coverage/OpenMP flags fpm test itself needs. Note it still replaces
    # fpm's default profile flags, same as before.
    - FPM_FFLAGS="--coverage" fpm test --verbose
    # Runs tools/run_error_scenarios.sh's own scenario list too, so it can't silently drift out
    # of parity with test/error_scenarios.f90's `select case` (see run_error_scenarios.sh's own
    # header comment) -- fpm test above already exercises every scenario via test_errors.f90, but
    # only this script checks that its independently-maintained list still names every one of them.
    - tools/run_error_scenarios.sh
    # --exclude-lines-by-pattern auto-excludes every standalone report_fatal_error(...) call
    # site in src/parquet_wrapper.cpp (present and future -- no per-call-site source comment
    # needed) without needing GCOVR_EXCL_LINE comments at each one: std::abort() there discards
    # that whole process's gcov data, so these lines can never show as covered no matter how
    # well-tested. Deliberately anchored to "only
    # whitespace before report_fatal_error(" rather than a bare ".*" -- a handful of call sites
    # are the tail of an `if (cond) report_fatal_error(...);` guard on one line (the temporal
    # nrows-mismatch checks), where the `if` itself genuinely runs on every normal read and a
    # bare ".*" pattern would silently discard that real coverage signal too. Call sites that
    # wrap across multiple source lines still need their own GCOVR_EXCL_LINE on the continuation
    # line(s), since the regex only matches the line where "report_fatal_error(" itself appears
    # -- already applied directly in src/parquet_wrapper.cpp for those (and for
    # report_fatal_error's own body / ConcurrencyGuard's abort block, which don't call
    # themselves so can't match this pattern). Keep tools/coverage_cpp.sh's own
    # EXCLUDE_LINE_PATTERNS in sync with this regex if it ever changes.
    - gcovr -r . --filter 'src/*' --exclude 'src/test*' --exclude-lines-by-pattern '\s*report_fatal_error\('

# Three manual, non-gating diagnostic jobs added to chase a SIGSEGV seen only under this runner's
# own concurrency (test/test_table.f90's "table" suite, specifically test_sort_matches_read_time
# -- see the investigation this was added for). It reproduces reliably in CI and has not
# reproduced at all locally across many attempts (plain and -fopenmp, single-suite and full suite,
# single-test loops, and deliberately oversubscribed thread counts), which points at either a race
# or a compiler-version-dependent codegen issue rather than a deterministic logic bug -- exactly
# the class of failure CLAUDE.md's "Tests run concurrently" note describes as invisible to a green
# run. None of the three is wired into the normal pipeline (`when: manual`, `allow_failure: true`):
# all are much slower than the plain `test` job and only useful while actively chasing this one
# issue. Trigger whichever theory needs checking from the pipeline's "Run" button; delete all three
# once the underlying bug is fixed and confirmed gone (they exist to find it, not to guard against
# it forever -- that job, if still needed after a fix, belongs in `test:` itself, not here).
# Two real, narrow bugs have already been found and fixed this way (an Arrow type-singleton race,
# and a `character(len=:), allocatable` function-result race -- see CLAUDE.md's Arrow-singleton and
# "no character-returning function" notes) without the symptom actually going away, which is why a
# third, different-shaped job (debug_gcc14_table) was added rather than continuing to assume it's
# still this project's own source at fault.
#
# debug_asan_table: catches a stray out-of-bounds/use-after-free write. This is the leading
# theory: the CI log showed a genuine ERROR STOP from table_check_not_detached (implying
# `detached` really did read back .true. right after a fresh %open) immediately followed by a
# SIGSEGV in that same trivial guard on a LATER call -- the signature of heap corruption from
# somewhere else in the process, not a real detached table. AddressSanitizer/UBSan will abort
# immediately, with a precise stack trace, the instant any thread makes an invalid access,
# whether or not that thread is the one whose *symptom* would otherwise have shown up later.
debug_asan_table:
  tags:
    - focal
  stage: test
  when: manual
  allow_failure: true
  variables:
    # -O1 (not -O0) per ASan's own recommendation: enough optimization for a reasonable-speed
    # loop below, while keeping frame pointers (-fno-omit-frame-pointer) for a readable
    # backtrace. -g on both sides so the trace resolves to source lines, not bare addresses.
    # UndefinedBehaviorSanitizer rides along for free (same -fsanitize= flag) and costs nothing
    # extra to check while ASan is already instrumenting the build.
    FPM_FFLAGS: "-fopenmp -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
    FPM_CXXFLAGS: "-std=c++20 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
    FPM_LDFLAGS: "-lstdc++ -fsanitize=address,undefined"
    ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=0:print_stacktrace=1"
    UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
  script:
    # The race needs concurrent scheduling to show up at all, so this repeats the one suite that
    # has reproduced it rather than the whole (much slower) test binary; ASan aborts the whole
    # job on the first bad access, so a repeated loop is what turns "occasionally" into "this
    # job run" without needing to guess the exact iteration count in advance.
    - |
      for i in $(seq 1 50); do
        echo "=== table suite attempt $i ==="
        fpm test run_tester -- table
      done

# debug_tsan_table: catches a genuine DATA RACE (two threads touching the same memory with no
# ordering between them, neither access necessarily out of bounds) -- a different failure class
# from debug_asan_table above, and one ASan cannot see at all. GCC does not support combining
# -fsanitize=thread with -fsanitize=address in one build, so this has to be its own job rather
# than an extra flag on the one above. Worth running if debug_asan_table comes back clean: a
# clean ASan/UBSan run rules out corruption/UB but says nothing about an unsynchronized read of,
# say, a parquet_table's cache pointer or detached flag from two OpenMP threads at once.
debug_tsan_table:
  tags:
    - focal
  stage: test
  when: manual
  allow_failure: true
  variables:
    FPM_FFLAGS: "-fopenmp -g -O1 -fsanitize=thread -fno-omit-frame-pointer"
    FPM_CXXFLAGS: "-std=c++20 -g -O1 -fsanitize=thread -fno-omit-frame-pointer"
    FPM_LDFLAGS: "-lstdc++ -fsanitize=thread"
    TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
  script:
    - |
      for i in $(seq 1 50); do
        echo "=== table suite attempt $i ==="
        fpm test run_tester -- table
      done

# debug_gcc14_table: tests a completely different theory from the two jobs above -- not a bug in
# this project's own source, but a gfortran-13-vintage compiler codegen defect. Two real, narrow
# races were found and fixed via debug_asan_table/debug_tsan_table above (an Arrow type-singleton
# race, and a `character(len=:), allocatable` function-result race matching the known, still-open
# GCC PR113797 -- see CLAUDE.md), yet the exact same SIGSEGV/detached-table symptom kept
# reproducing on THIS runner afterwards, unchanged. Meanwhile it could not be reproduced even once
# locally on gfortran 15.2.0, including under deliberately extreme oversubscription (OMP_NUM_THREADS
# forced to 6-8x the physical core count, well past what CI's own concurrency needs) -- a flat zero
# that a genuine, hardware-independent race should not produce. That asymmetry (100% on this
# runner's gfortran 13, 0% on gfortran 15 under hostile conditions) is consistent with a codegen bug
# that a later gfortran release already narrows or fixes, even though the tracking issue remains
# nominally open upstream. This job isolates that one variable: identical build/test otherwise,
# gfortran-14/gcc-14/g++-14 in place of the image's apt-default 13. A clean run here is evidence
# (not proof) that what's left is compiler-version-dependent, not a remaining bug in this project's
# own source; a failure here means the compiler-version theory is wrong and the search continues in
# this project's own code instead.
debug_gcc14_table:
  tags:
    - focal
  stage: test
  when: manual
  allow_failure: true
  before_script:
    - apt-get update -y
    - apt-get upgrade -y
    - apt-get install -y --no-install-recommends ca-certificates lsb-release wget gnupg
          gfortran-14 gcc-14 g++-14 make git git-lfs gcovr
    - git lfs install --skip-repo
    - git lfs pull
    - wget "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
    - apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
    - apt-get update -y
    - apt-get install -y -V libarrow-dev libarrow-compute-dev libparquet-dev
    - apt-get install -y python3-venv
    - apt-get install -y pipx
    - pipx ensurepath
    - pipx install fpm
    - export PATH=~/.local/bin:$PATH
  variables:
    # FPM_FC/FPM_CC/FPM_CXX (not just PATH order) is the only reliable way to pin fpm to the
    # non-default gcc-14 toolchain -- update-alternatives would also change what plain `gfortran`/
    # `gcc`/`g++` resolve to for every OTHER job sharing this runner's image, which is exactly the
    # kind of cross-job side effect a diagnostic-only job must not risk.
    FPM_FC: "gfortran-14"
    FPM_CC: "gcc-14"
    FPM_CXX: "g++-14"
    FPM_FFLAGS: "-fopenmp"
    FPM_CXXFLAGS: "-std=c++20"
    FPM_LDFLAGS: "-lstdc++"
  script:
    - gfortran-14 --version
    - |
      for i in $(seq 1 50); do
        echo "=== table suite attempt $i ==="
        fpm test run_tester -- table
      done

# GitLab Pages is not enabled on this instance (confirmed by the gitlab.4most.eu
# admin, no plans to enable it) -- docs are instead uploaded as a tarball to the
# instance's readthedocs-style docserver, which then serves them at
# https://www.4most.eu/readthedocs/<group>/<project>/<branch>. $DOCSERVER_TOKEN
# is provided by the GitLab instance itself (not something this project defines).
# Restricted to the default branch only. Deliberately overrides the top-level
# before_script: generating docs from source comments only needs a C preprocessor
# (cpp, pulled in by the gcc package) and FORD itself -- none of the test job's
# Arrow/Parquet/fpm/git-lfs setup is needed here, so skip it for a faster, more
# isolated job. See docs.md/fpm.toml's [extra.ford] for FORD's own configuration
# (preprocessor, page_dir, etc.).
readthedocs:
  stage: docs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends gcc python3-venv pipx curl
    - pipx ensurepath
    - pipx install ford
    - export PATH=~/.local/bin:$PATH
  script:
    - ford docs.md
    - tools/fix_ford_page_links.sh ford-doc
    - tar -czf docs.tar.gz -C ford-doc .
    - >
      curl -f --request POST
      --header "X-Docserver-Token: $DOCSERVER_TOKEN"
      --header "X-Project-Path: $CI_PROJECT_PATH"
      --header "X-Git-Branch: $CI_COMMIT_BRANCH"
      --header "X-Git-Tag: $CI_COMMIT_TAG"
      --data-binary @docs.tar.gz
      https://escience.aip.de/readthedocs/webhooks/upload
