name = "parquet-fortran"
version = "VERSION.txt"
license = "BSD-3-Clause"
author = "Elmo Tempel"
maintainer = "elmo.tempel@ut.ee"
copyright = "Copyright 2026, Elmo Tempel"
description = "Parquet Fortran is a Fortran library for reading and writing Parquet files."
homepage = "https://github.com/etempel/parquet-fortran"
keywords = ["parquet", "arrow", "io", "columnar", "maml", "data"]
categories = ["io"]

[[executable]]
name = "run_parquet_fortran"
source-dir = "app"
main = "program.f90"

[dependencies]
openmp = "*"

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["arrow", "arrow_compute", "parquet"]

[install]
library = false
test = false

[features]

# standard
nagfor.flags = "-openmp -f2018 -nan -colour -w=unused -Warn=unkind_real_literal -Warn=double_real_literal -Warn=subnormal"
# standard + -thread_safe + extended warnings
#nagfor.flags = "-openmp -f2018 -nan -colour -info -w=unused -Warn=allocation -Warn=unkind_real_literal -Warn=double_real_literal -Warn=subnormal -thread_safe"

# Paranoid debugging build: every -C= check nagfor 7.2 can actually run against this project.
#
# Two of them are deliberately absent, and each absence is load-bearing rather than untried:
#
#   -C=intovf    Correct behaviour, not a defect: it is nagfor's -ftrapv, and it traps the two
#                deliberate wrapping multiplies src/parquet_random.f90 documents as "UB site 1 of 2".
#   -C=undefined THREE independent nagfor 7.2 defects, none of them a finding about this code.
#                (a) `Panic: Cannot find scope id 0` -- an internal compiler error, triggered by
#                    compiling ANY submodule of a separately compiled module that declares a FINAL
#                    binding bound to a SEPARATE MODULE PROCEDURE. FIXED HERE by keeping every
#                    FINAL target module-contained (see src/parquet_core.f90's contains section and
#                    the note in tools/generate_parquet_tables.py); do not move one back into a
#                    submodule. 15-line reproducer in feature_nag_ice_scope_id.md.
#                (b) nagfor emits invalid C for the implicit finalization of an ARRAY whose element
#                    type has a FINALIZABLE COMPONENT: the generated pointer difference mixes the
#                    element-struct pointer with `Char *`, and the host C compiler rejects it
#                    ("are not pointers to compatible types"). test/test_parquet_string.f90's
#                    `type(t_row) :: rows(3)` hits it, t_row holding a type(parquet_string) whose
#                    finalizer nullifies the handle. NOT the same bug as (a). Cleared once by
#                    deleting parquet_string's redundant finalizer; it REAPPEARS at
#                    src/parquet_tables_lifecycle.f90:671 for an array of parquet_table_column,
#                    which reaches a finalizable component transitively via parquet_column ->
#                    parquet_string_column. Removing THAT finalizer (also redundant -- Fortran
#                    deallocates allocatable components itself) was measured to clear the site, but
#                    it is a public owning type and the change was not made.
#                (c) A THIRD defect behind (b): invalid C for a character dope vector, at
#                    test/test_table_codegen.f90:589. So -C=undefined costs at least three source
#                    concessions to reach and there is no sign (c) is the last one.
#                Note -C=all does NOT imply -C=undefined, so the nagdeb set below is unaffected.
#
# Both are written up in feature_nag_runtime_checks.md. Full suite under the set below:
# 1783 passed, 0 failed, zero crashes, zero hangs.
#
# -C=dangling and -C=calls are BOTH in, and both are here only because src/parquet_write_numeric.f90
# and src/parquet_write_string.f90 no longer declare a dummy that is at once `optional`,
# assumed-size and `target`. nagfor 7.2 miscompiles a call passing an ABSENT optional actual to
# such a dummy -- under either check, and worst under both -- so restoring that attribute takes the
# suite from 1783/0 to 243 of 824 error scenarios dying on SIGSEGV, SIGBUS or a 120 s hang. The
# reasoning is written out beside the workers; do not put the attribute back.
#nagdeb.flags = "-C=all -C=undefined -g -gline -mtrace"
#nagdeb.flags = "-C=all -g"
nagdeb.flags = "-C=alias -C=array -C=bits -C=calls -C=dangling -C=do -C=present -C=pointer -C=recursion -g"

[profiles]
nag = ["nagfor"]
nagdeb = ["nagfor", "nagdeb"]

[preprocess]
[preprocess.cpp]
suffixes = ["f90"]
macros=["RELEASE_VERSION={version}"]

[extra.ford]
project = "parquet-fortran"
summary = "Fortran library for reading and writing Parquet files"
src_dir = ["./src"]
exclude_dir = ["./test"]
exclude = ["**/parquet_bindings.f90"]
page_dir = "./doc/pages"
output_dir = "./ford-doc"
media_dir = "./doc/media"
favicon = "./doc/media/favicon.png"
css = "./doc/user.css"
display = ["public", "protected"]
source = true
graph = true
search = true
preprocessor = "cpp -traditional-cpp -E"
md_extensions = ["markdown.extensions.toc"]

[extra.ford.extra_mods]
iso_fortran_env = "https://gcc.gnu.org/onlinedocs/gfortran/ISO_005fFORTRAN_005fENV.html"
iso_c_binding = "https://gcc.gnu.org/onlinedocs/gfortran/ISO_005fC_005fBINDING.html"
