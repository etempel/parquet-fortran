name = "parquet-fortran"
version = "VERSION.txt"
license = "BSD-3-Clause"
author = "Elmo Tempel"
maintainer = "elmo.tempel@ut.ee"
copyright = "Copyright 2026, Elmo Tempel"
description = "Parquet Fortran is a Fortran library for reading and writing Parquet files."
homepage = "https://github.com/etempel/parquet-fortran"
keywords = ["parquet", "arrow", "io", "columnar", "maml", "data"]
categories = ["io"]

[[executable]]
name = "run_parquet_fortran"
source-dir = "app"
main = "program.f90"

[dependencies]
openmp = "*"

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["arrow", "arrow_compute", "parquet"]

[install]
library = false
test = false

[features]

# standard
nagfor.flags = "-f2018 -nan -colour -w=unused -Warn=unkind_real_literal -Warn=double_real_literal -Warn=subnormal"
# standard + -thread_safe + extended warnings
#nagfor.flags = "-f2018 -nan -colour -info -w=unused -Warn=allocation -Warn=unkind_real_literal -Warn=double_real_literal -Warn=subnormal -thread_safe"

# Paranoid debugging build: every -C= check nagfor 7.2 can actually run against this project.
#
# Two of them are deliberately absent, and each absence is load-bearing rather than untried:
#
#   -C=intovf    Correct behaviour, not a defect: it is nagfor's -ftrapv, and it traps the two
#                deliberate wrapping multiplies src/parquet_random.f90 documents as "UB site 1 of 2".
#   -C=undefined THREE nagfor 7.2 defects plus ONE documented limitation, none a finding about
#                this code. The three defects were compile-time and are FIXED here, so the project
#                now BUILDS cleanly under -C=undefined; the limitation is a runtime miscompilation
#                of every bind(C) call and is why the option is still excluded. Each was revealed
#                only once the one in front of it was cleared.
#                (a) `Panic: Cannot find scope id 0` -- an ICE, triggered by compiling ANY submodule
#                    of a separately compiled module that declares a FINAL binding bound to a
#                    SEPARATE MODULE PROCEDURE. Fixed by keeping every FINAL target
#                    module-contained (src/parquet_core.f90's contains section, and the note in
#                    tools/generate_parquet_tables.py). Do not move one back into a submodule.
#                (b) Invalid C for the implicit finalization of an ARRAY whose element type has a
#                    FINALIZABLE COMPONENT (a pointer difference mixing the element-struct pointer
#                    with `Char *`). Fixed by deleting two redundant finalizers -- parquet_string's
#                    and parquet_string_column's -- neither of which freed anything the language
#                    was not already freeing. See the notes in their own type bodies.
#                (c) Invalid C for a POINTER-valued function result used directly as an actual
#                    argument (`assigning to 'Char *' from '__NAGf90_ChDope1'`). Fixed in
#                    test/test_table_codegen.f90 by binding each accessor form to a local pointer
#                    first, which is what every other column in that file already did.
#                (d) NOT FIXABLE, and DOCUMENTED: the nagfor manual says -C=undefined "is not
#                    compatible with calling C code via a BIND(C) interface" and that "the whole
#                    program must be Fortran code and compiled the same way" -- but the violation
#                    is accepted with NO diagnostic: nagfor miscompiles every bind(C) call,
#                    inserting a spurious extra argument after the first. A 20-line
#                    reproducer with a plain-Fortran control in the same program prints
#                    "a=11 b=0 c=22" for the bind(C) call and "a=11 b=22 c=33" for the control.
#                    `nagfor -S` shows why: NAG interleaves a definedness-map pointer after every
#                    argument and appends a hidden length per map -- its -C=undefined
#                    instrumentation ABI -- into a call whose callee has the plain C signature.
#                    Independent of the C/C++ compiler used for the other half (measured across
#                    Apple clang, gcc-mp-15 and clang-mp-22, as C and as C++).
#                    Only argument 1 survives, so a handle still arrives and the failure looks
#                    like corrupted data rather than a broken call. This one defect explains both
#                    runtime symptoms seen here: the writer's compression codec arriving as
#                    garbage, and error scenario extended_qc_range_violation_warns appearing to
#                    hang (parquet_reader_set_qc's rule count `n` arrives as a ~4.4e9 pointer
#                    value, so its loop runs billions of iterations). This library reaches Arrow
#                    only across bind(C), so there is no workaround and -C=undefined stays out for
#                    as long as this stands: per-file exclusion is impossible (the option is
#                    stamped into every .mod; a mismatched `use` is a fatal error both ways), and
#                    an augmented-ABI C shim was investigated and rejected -- see CLAUDE.md's NAG
#                    section. The all-Fortran suites DO run under it, and pass:
#                    fpm test run_tester --flag "-C=undefined" -- random    (likewise random_perm
#                    and random_weighted). Standalone report, with the generated C
#                    and the compiler matrix: feature_nag_bindc_undefined.md.
#                Note -C=all does NOT imply -C=undefined, so the nagdeb set below is unaffected.
#
# Both are written up in feature_nag_runtime_checks.md. Full suite under the set below:
# 1783 passed, 0 failed, zero crashes, zero hangs.
#
# -C=dangling and -C=calls are BOTH in, and both are here only because src/parquet_write_numeric.f90
# and src/parquet_write_string.f90 no longer declare a dummy that is at once `optional`,
# assumed-size and `target`. nagfor 7.2 miscompiles a call passing an ABSENT optional actual to
# such a dummy -- under either check, and worst under both -- so restoring that attribute takes the
# suite from 1783/0 to 243 of 824 error scenarios dying on SIGSEGV, SIGBUS or a 120 s hang. The
# reasoning is written out beside the workers; do not put the attribute back.
#nagdeb.flags = "-C=all -C=undefined -g -gline -mtrace"
#nagdeb.flags = "-C=all -g"
nagdeb.flags = "-C=alias -C=array -C=bits -C=calls -C=dangling -C=do -C=present -C=pointer -C=recursion -g"

nagundefined.flags = "-C=undefined"

[profiles]
nag = ["nagfor"]
nagdeb = ["nagfor", "nagdeb"]
nagundef = ["nagfor", "nagdeb", "nagundefined"]

[preprocess]
[preprocess.cpp]
suffixes = ["f90"]
macros=["RELEASE_VERSION={version}"]

[extra.ford]
project = "parquet-fortran"
summary = "Fortran library for reading and writing Parquet files"
src_dir = ["./src"]
exclude_dir = ["./test"]
exclude = ["**/parquet_bindings.f90"]
page_dir = "./doc/pages"
output_dir = "./ford-doc"
media_dir = "./doc/media"
favicon = "./doc/media/favicon.png"
css = "./doc/user.css"
display = ["public", "protected"]
source = true
graph = true
search = true
preprocessor = "cpp -traditional-cpp -E"
md_extensions = ["markdown.extensions.toc"]

[extra.ford.extra_mods]
iso_fortran_env = "https://gcc.gnu.org/onlinedocs/gfortran/ISO_005fFORTRAN_005fENV.html"
iso_c_binding = "https://gcc.gnu.org/onlinedocs/gfortran/ISO_005fC_005fBINDING.html"
